<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2033;--mu:#5d6580;--ac:#3b5bdb;--ok:#2b8a3e;--bad:#c92a2a;--bd:#e2e6f0;--onac:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1f2b;--tx:#e8eaf3;--mu:#98a0ba;--ac:#7c96ff;--ok:#5ec27a;--bad:#ff7b7b;--bd:#2c3244;--onac:#0b1020}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1f2b;--tx:#e8eaf3;--mu:#98a0ba;--ac:#7c96ff;--ok:#5ec27a;--bad:#ff7b7b;--bd:#2c3244;--onac:#0b1020}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
main{max-width:820px;margin:0 auto;padding:16px}h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.1rem;margin:1.2em 0 .5em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mu{color:var(--mu);font-size:.9rem}.big{font-size:1.7rem;font-weight:700}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--ac);color:var(--onac);border-color:var(--ac)}button.d{color:var(--bad)}button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{min-height:120px}label{display:block;font-size:.9rem;color:var(--mu);margin:8px 0 4px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.chip{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;font-size:.72rem;padding:8px 2px;color:var(--mu)}nav button.on{color:var(--ac);font-weight:700}
body.inrun nav{display:none}.sticky{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:4}
.pal button{min-width:40px;padding:6px}.pal .a{background:var(--ac);color:var(--onac)}.fb{border-left:4px solid var(--ac);padding-left:10px;margin-top:10px}
#ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9;color:#fff;text-align:center;padding:20px}
#toast{position:fixed;left:12px;right:12px;bottom:80px;background:#222;color:#fff;padding:12px;border-radius:10px;display:none;z-index:10}
.days{display:flex;gap:6px;align-items:flex-end;height:80px}.days div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}

:root{color-scheme:light dark}:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
html,body{overflow-x:hidden}main{overflow-wrap:anywhere}button,input,select,textarea,summary{touch-action:manipulation}summary{cursor:pointer;min-height:44px;padding:10px 0;color:var(--mu)}
body,.card,button,input,select,textarea,nav,.sticky,.bar{transition:background-color .25s,color .25s,border-color .25s}
.seg button{flex:1}.step{font-size:.8rem;color:var(--mu);margin-bottom:6px}
.tmb{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 14px;border-radius:99px;border:2px solid var(--ac);transition:background-color .2s,color .2s}
.tmb.warn{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s ease-in-out infinite}
.bar i{transition:width .45s cubic-bezier(.2,.8,.2,1)}
.pg{animation:pgin .22s ease-out}.pg .bar i{animation:grow .6s ease-out}.qin{animation:qin .2s ease-out}
.fb.okf{animation:pop .3s ease-out;border-left-color:var(--ok)}.fb.nof{animation:shake .35s;border-left-color:var(--bad)}.opt.ok{animation:pop .3s}.opt.no{animation:shake .35s}
.done{display:inline-flex;gap:8px;align-items:center;font-weight:700;color:var(--ok);animation:pop .4s ease-out}.done span{width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.flip{perspective:900px;cursor:pointer;margin:10px 0}.fi{position:relative;min-height:220px;transition:transform .45s;transform-style:preserve-3d}.flip.on .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;margin:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto}.ff.bk{transform:rotateY(180deg)}
.ovc{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:18px;width:min(92vw,360px);text-align:left}
.sk{height:12px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,var(--bd),var(--bg),var(--bd));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes pgin{from{opacity:0;transform:translateY(8px)}}@keyframes qin{from{opacity:0;transform:translateX(14px)}}@keyframes grow{from{width:0}}
@keyframes pop{0%{transform:scale(.96);opacity:.5}60%{transform:scale(1.02)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{50%{opacity:.75}}@keyframes sh{to{background-position:-200% 0}}

.mascotWrap{position:relative;height:60px;margin:6px 0 4px;overflow:visible}
.mascotSvg{width:52px;height:52px;position:absolute;left:0;top:4px;color:var(--tx)}
.mascotWrap.ok .mascotSvg{animation:runAcross 1.15s cubic-bezier(.3,.55,.4,1) forwards}
.mascotWrap.bad .mascotSvg{animation:slump .45s ease-out forwards}
.mleg,.marm{transform-box:fill-box;transform-origin:top center}
.mascotWrap.ok .mleg{animation:legSwing .32s ease-in-out infinite}
.mascotWrap.ok .mleg.r{animation-delay:.16s}
.mascotWrap.ok .marm{animation:armSwing .32s ease-in-out infinite}
.mascotWrap.ok .marm.l{animation-delay:.16s}
.mascotWrap.bad .mhead{transform-box:fill-box;transform-origin:center;animation:droop .45s ease-out forwards}
.mascotWrap.bad .mface .mouth-h{display:none}.mascotWrap.ok .mface .mouth-s{display:none}
.mfx{position:absolute;font-size:15px;opacity:0}
.mascotWrap.ok .mfx{animation:sparkPop .8s ease-out forwards}
.mascotWrap.ok .s1{left:6px;top:0;animation-delay:.05s}.mascotWrap.ok .s2{left:30px;top:2px;animation-delay:.22s}.mascotWrap.ok .s3{left:46px;top:-4px;animation-delay:.4s}
.mascotWrap.bad .mfx{left:34px;top:0;animation:dropFall .9s ease-in forwards}
@keyframes runAcross{0%{left:0;top:8px}15%{top:0}30%{top:8px}45%{top:0}60%{top:8px}75%{top:-3px}100%{left:calc(100% - 52px);top:-3px}}
@keyframes legSwing{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-10deg)}}
@keyframes armSwing{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
@keyframes slump{0%{transform:translateY(0)}100%{transform:translateY(5px)}}
@keyframes droop{0%{transform:rotate(0)}100%{transform:rotate(13deg)}}
@keyframes sparkPop{0%{opacity:0;transform:scale(.4) translateY(0)}35%{opacity:1;transform:scale(1.1) translateY(-8px)}100%{opacity:0;transform:scale(.8) translateY(-18px)}}
@keyframes dropFall{0%{opacity:0;transform:translateY(-4px)}30%{opacity:1}100%{opacity:.9;transform:translateY(10px)}}
.coinStack{position:relative;height:74px}
.coin{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d0,#f4c430 55%,#c98f0a 100%);border:2px solid #a9760a;opacity:0;animation:coinDrop .5s cubic-bezier(.34,1.56,.64,1) forwards}
.coin::after{content:'$';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#8a5a00}
@keyframes coinDrop{0%{opacity:0;transform:translateY(-40px) scale(.6) rotate(-20deg)}70%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
.bolts{display:flex;gap:10px;font-size:22px}
.bolt{opacity:.25;filter:grayscale(1);transform:scale(.8);display:inline-block}
.bolt.lit{opacity:0;animation:boltPop .5s ease-out forwards}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer;position:relative;min-height:0}
.swatch.sel{border-color:var(--tx);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--tx)}
.swatch.sel::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.7)}
@keyframes boltPop{0%{opacity:0;transform:scale(.4) rotate(-15deg);filter:grayscale(1)}60%{opacity:1;transform:scale(1.15) rotate(6deg);filter:grayscale(0) drop-shadow(0 0 6px #f5b301)}100%{opacity:1;transform:scale(1) rotate(0);filter:grayscale(0) drop-shadow(0 0 3px #f5b301)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style></head><body>
<main id="app"></main>
<nav><button data-v="home" onclick="go('home')">Home</button><button data-v="materials" onclick="go('materials')">Materials</button><button data-v="practice" onclick="go('practice')">Practice</button><button data-v="cards" onclick="go('cards')">Cards</button><button data-v="mistakes" onclick="go('mistakes')">Mistakes</button><button data-v="progress" onclick="go('progress')">Progress</button><button data-v="settings" onclick="go('settings')">Settings</button></nav>
<div id="ov" role="status" aria-live="polite"><div class="ovc"><b id="ovt"></b><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:60%"></div></div></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ================= StudyFlow configuration ================= */
/* Paste your own Supabase project values below. Never put a Gemini/AI
   provider key here or anywhere in this file — it stays server-side as
   a Supabase Edge Function secret. */
const SUPABASE_URL = 'https://rujkjjthptzrklewpsfx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_JO6fpODIEOo6r1WDRuUokA_iVwF-QTu';
const SUPABASE_FUNCTION = SUPABASE_URL + '/functions/v1/generate-questions';
/* ============================================================= */
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TN={mcq:'MCQ',fill:'Fill in the blank',saq:'Short answer',essay:'Essay'};
let S={materials:[],sets:[],sessions:[],mistakes:[],cards:[],prefs:{n:10,mode:'study',mins:20,theme:'auto',analytics:false,color:'blue'}};
try{const r=localStorage.getItem('studyflow');if(r)S=Object.assign(S,JSON.parse(r));if(!S.prefs.color)S.prefs.color='blue'}catch(e){}
function save(){try{localStorage.setItem('studyflow',JSON.stringify(S))}catch(e){toast('StudyFlow could not save (browser storage is full or blocked). Delete an old material and try again.')}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',6000)}
function busy(m){$('#ov').style.display=m?'flex':'none';$('#ovt').textContent=m||''}
let view='home',arg=null,run=null,timer=null,deck=null,pgA=false,qA=false,fin=false,sp={},selM=new Set(),genMats=[];
function go(v,a){pgA=true;view=v;arg=a==null?null:a;if(v!=='run'&&timer){clearInterval(timer);timer=null}render();scrollTo(0,0)}
const COLORS={blue:{l:['#3b5bdb','#fff'],d:['#7c96ff','#0b1020']},purple:{l:['#7048e8','#fff'],d:['#b197fc','#1a1030']},sky:{l:['#1864ab','#fff'],d:['#74c0fc','#08202f']},maroon:{l:['#a61e4d','#fff'],d:['#f783ac','#3a0a1a']},brown:{l:['#6b4423','#fff'],d:['#d8a26a','#2a1806']},teal:{l:['#087f5b','#fff'],d:['#63e6be','#04261c']},amber:{l:['#c2410c','#fff'],d:['#ffa94d','#3a1c02']}};
function setTheme(v){S.prefs.theme=v;save();applyTheme();applyColor();render()}
function setColor(name){if(!COLORS[name])return;S.prefs.color=name;save();applyColor();render()}
function applyColor(){const c=COLORS[S.prefs.color]||COLORS.blue,t=S.prefs.theme,dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches),v=dark?c.d:c.l;
 document.documentElement.style.setProperty('--ac',v[0]);document.documentElement.style.setProperty('--onac',v[1])}
function applyTheme(){const t=S.prefs.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.prefs.theme==='auto')applyColor()});
function render(){const V={home,materials,gen,start:startView,practice,run:runView,results,cards,deck:deckView,mistakes,progress,settings};
 const hh=(V[view]||home)();$('#app').innerHTML='<div class="'+(pgA?'pg':'')+'">'+hh+'</div>';
 if(view==='run'&&run){const pb=$('#pb');if(pb)requestAnimationFrame(()=>requestAnimationFrame(()=>{pb.style.width=run.tw+'%';run.pw=run.tw}))}
 if(view==='results'&&pgA)countUp();pgA=false;qA=false;document.body.classList.toggle('inrun',view==='run');
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view||(view==='gen'&&b.dataset.v==='materials')||(view==='results'&&b.dataset.v==='practice')))}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ago=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});

/* ---------- extraction ---------- */
const dec=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
async function extract(f){const ext=f.name.split('.').pop().toLowerCase();let out=[];
 if(ext==='txt'||ext==='md'){out=[{ref:'Text',text:await f.text()}]}
 else if(ext==='pdf'){if(!window.pdfjsLib)throw new Error('the PDF reader failed to load (check your connection)');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  for(let p=1;p<=pdf.numPages;p++){const c=await(await pdf.getPage(p)).getTextContent();out.push({ref:'Page '+p,text:c.items.map(i=>i.str).join(' ')})}}
 else if(ext==='docx'||ext==='pptx'){if(!window.JSZip)throw new Error('the Office reader failed to load');
  const z=await JSZip.loadAsync(await f.arrayBuffer());
  if(ext==='docx'){const x=await z.file('word/document.xml').async('string');const ps=x.split('</w:p>').map(p=>dec(p.replace(/<[^>]+>/g,''))).filter(p=>p.trim());
   for(let i=0;i<ps.length;i+=25)out.push({ref:'Section '+(i/25+1),text:ps.slice(i,i+25).join('\n')})}
  else{const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/(\d+)\.xml/)[1])-parseInt(b.match(/(\d+)\.xml/)[1]));
   for(const n of names){const x=await z.file(n).async('string');out.push({ref:'Slide '+n.match(/(\d+)\.xml/)[1],text:(x.match(/<a:t>[^<]*<\/a:t>/g)||[]).map(t=>dec(t.replace(/<[^>]+>/g,''))).join(' ')})}}}
 else throw new Error('unsupported');
 return out.filter(p=>p.text.trim())}
async function readOne(f){const ext=f.name.split('.').pop().toLowerCase();
 if(f.size>15*1024*1024)throw new Error('over 15 MB — split it into smaller files');
 if(!f.size)throw new Error('empty file');
 if(!['pdf','docx','pptx','txt','md'].includes(ext))throw new Error('unsupported type (PDF, DOCX, PPTX, TXT only)');
 const pages=await extract(f);const n=pages.reduce((a,p)=>a+p.text.length,0);
 if(n<50)throw new Error('no readable text found (scanned PDFs need OCR, which is not built yet)');
 return{pages,chars:n,ext}}
async function upload(files){const subj=($('#subj').value||'').trim()||'General';const list=[...files];if(!list.length)return;
 if(list.length===1){const f=list[0];busy('Reading '+f.name+'…');
  try{const r=await readOne(f);
   S.materials.unshift({id:uid(),title:f.name.replace(/\.[^.]+$/,''),file:f.name,type:r.ext,date:Date.now(),subject:subj,status:'ready',chars:r.chars,pages:r.pages.slice(0,300).map(p=>({ref:p.ref,text:p.text.slice(0,4000)}))});save();
  }catch(e){toast('StudyFlow could not read '+f.name+': '+e.message+'.')}
  busy(false);go('materials');return}
 /* multiple files chosen together become ONE combined material/session */
 let allPages=[],chars=0,okNames=[],skipped=[];
 for(const f of list){busy('Reading '+f.name+'… ('+(okNames.length+skipped.length+1)+'/'+list.length+')');
  try{const r=await readOne(f);allPages.push(...r.pages.slice(0,300).map(p=>({ref:f.name.replace(/\.[^.]+$/,'')+' — '+p.ref,text:p.text.slice(0,4000)})));chars+=r.chars;okNames.push(f.name);
  }catch(e){skipped.push(f.name+': '+e.message)}}
 busy(false);
 if(!okNames.length){toast('StudyFlow could not read any of the '+list.length+' files.');go('materials');return}
 const title=subj!=='General'?subj:okNames.length+' files';
 S.materials.unshift({id:uid(),title,file:okNames.length+' files combined',type:'combined',date:Date.now(),subject:subj,status:'ready',chars,pages:allPages.slice(0,400),sourceFiles:okNames});save();
 toast((skipped.length?'Combined '+okNames.length+' of '+list.length+' files into one session. Skipped: '+skipped.join('; ')+'.':'Combined '+okNames.length+' files into one session.'));
 go('materials')}
function srcText(m,batch,b=14000){const ps=m.pages,tot=ps.reduce((a,p)=>a+p.text.length,0);let use=ps;
 if(tot>b){const k=Math.min(ps.length,20),per=Math.floor(b/k);use=[];for(let i=0;i<k;i++){const p=ps[Math.floor((i+(batch%3)/3)*ps.length/k)%ps.length];use.push({ref:p.ref,text:p.text.slice(0,per)})}}
 return use.map(p=>'['+p.ref+'] '+p.text).join('\n\n')}
function combinedSrc(ms,batch,b=14000){const pages=ms.flatMap(m=>m.pages.map(p=>({ref:(ms.length>1?m.title+' — ':'')+p.ref,text:p.text})));return srcText({pages},batch,b)}
function setMatIds(s){return s.matIds||(s.matId?[s.matId]:[])}

/* ---------- AI (Claude via the page runtime; key never in this file) ---------- */
async function ai(prompt,material){
 if(!SUPABASE_URL||SUPABASE_URL.includes('PASTE_')||!SUPABASE_PUBLISHABLE_KEY||SUPABASE_PUBLISHABLE_KEY.includes('PASTE_')){
  const e=new Error('Add your Supabase Project URL and publishable key in the StudyFlow configuration.');e.retryable=false;throw e}
 if(!material||!material.trim()){const e=new Error('No material text to send — the selected material looks empty.');e.retryable=false;throw e}
 let r;
 try{r=await fetch(SUPABASE_FUNCTION,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({prompt,material})})}
 catch(netErr){const e=new Error('Could not reach the AI service — check your internet connection and try again.');e.retryable=true;throw e}
 const data=await r.json().catch(()=>null);
 if(!r.ok){const msg=(data&&(data.error||data.details))||('Supabase AI request failed (HTTP '+r.status+').');
  const e=new Error(msg);e.retryable=(r.status===429||r.status>=500);throw e}
 if(!data||(!Array.isArray(data)&&!Array.isArray(data.questions))){const e=new Error('Supabase returned an unexpected response.');e.retryable=true;throw e}
 return data}
async function aiRetry(prompt,material){try{return await ai(prompt,material)}catch(e){if(e.retryable)return await ai(prompt,material);throw e}}
function norm(q,def,diff){if(!q||typeof q.q!=='string'||q.q.length<8)return null;
 const t=TN[q.type]?q.type:def;const DL=['easy','medium','hard'];
 const o={type:t,q:q.q.trim(),explanation:q.explanation||'',takeaway:q.takeaway||'',source:q.source||'',topic:q.topic||'General',rubric:q.rubric||'',marks:t==='saq'?3:t==='essay'?10:1,difficulty:diff==='mixed'?(DL.includes(q.difficulty)?q.difficulty:'medium'):(diff||'medium')};
 if(t==='mcq'){const op=Array.isArray(q.options)?q.options.map(x=>String(x).replace(/^[A-Da-d][).]\s+/,'')):[];const a=parseInt(q.answer);if(op.length<3||!(a>=0&&a<op.length))return null;o.options=op;o.answer=a}
 else if(t==='fill'){const a=[].concat(q.answer||[]).map(x=>String(x).trim()).filter(Boolean);if(!a.length)return null;o.answer=a}
 else{if(!q.answer||String(q.answer).length<10)return null;o.answer=String(q.answer)}return o}
async function generate(){const ms=genMats;if(!ms.length)return materials();const g=id=>$('#'+id).value;
 let n=Math.min(150,Math.max(1,parseInt(g('gn')==='c'?g('gc'):g('gn'))||10)),type=g('gt'),mode=g('gm'),diff=g('gd'),rand=$('#grand').checked;
 let mins=readMins('gtm','gtc');
 const cap=type==='essay'?5:type==='saq'?8:type==='mixed'?10:15;
 const all=[],seen=new Set();let err='',bag=[];
 const diffTxt=diff==='mixed'?'Use a MIX of difficulty levels across these questions — roughly equal parts easy, medium and hard. Set each question\'s "difficulty" field accordingly.':diff+' difficulty. Set each question\'s "difficulty" field to "'+diff+'".';
 try{for(let b=0;b<Math.ceil(n/cap)+2&&all.length<n;b++){busy('Generating questions… ('+all.length+'/'+n+')');
  const want=Math.min(cap,n-all.length),ti=type==='mixed'?'Use a mix of "mcq" (about half), "fill", "saq" and "essay".':'Every question must have type "'+type+'".';
  const material=combinedSrc(ms,b);
  const prompt='You write exam questions ONLY from the study material provided separately below. Never use outside facts; if the material does not support a question, do not write it.\nWrite '+want+' questions at '+diffTxt+' '+ti+' Vary styles: recall, concept, comparison, application, scenario. No duplicates or near-duplicates. For MCQs, put the correct option in a random position — do not favor any particular letter.'+(all.length?' Already written (avoid): '+all.map(q=>q.q.slice(0,50)).join(' | '):'')+'\nReturn ONLY JSON: {"questions":[{"type":"mcq|fill|saq|essay","q":"","options":["..","..","..",".."],"answer":"mcq: index 0-3; fill: array of accepted strings; saq/essay: model answer text","difficulty":"easy|medium|hard","rubric":"marking scheme (saq/essay)","explanation":"","takeaway":"","source":"e.g. Page 3","topic":""}]}';
  const r=await aiRetry(prompt,material);
  for(const q of (Array.isArray(r)?r:r.questions||[])){const o=norm(q,type==='mixed'?'mcq':type,diff);if(!o)continue;if(type!=='mixed'&&o.type!==type)continue;const k=o.q.toLowerCase().replace(/\W+/g,' ').slice(0,60);if(seen.has(k))continue;seen.add(k);
   if(o.type==='mcq'){if(!bag.length){bag=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
    const slot=bag.pop(),correct=o.options[o.answer],rest=o.options.filter((_,idx)=>idx!==o.answer);
    for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}
    rest.splice(slot,0,correct);o.options=rest;o.answer=slot}
   all.push(o);if(all.length>=n)break}}}
 catch(e){err=e.message}
 busy(false);
 if(!all.length){toast(err?'StudyFlow couldn\'t generate questions: '+err+'.':'StudyFlow couldn\'t write any valid questions from this material — it may be too short for this many questions. Try a lower count or add more material.');return}
 if(err)toast('Generated '+all.length+' of '+n+' questions, then stopped: '+err);
 const title=ms.length>1?ms.length+' materials — '+(TN[type]||'Mixed'):ms[0].title+' — '+(TN[type]||'Mixed');
 const subject=[...new Set(ms.map(x=>x.subject))].join(' + ');
 const set={id:uid(),title,matIds:ms.map(x=>x.id),subject,date:Date.now(),mode,mins,qs:all,rand,attempts:[]};S.sets.unshift(set);save();go('practice')}
async function genCards(id){
 /* The deployed Supabase Edge Function (generate-questions) is shaped for exam

    (e.g. a generate-flashcards function) exists. */

/* ---------- marking & running ---------- */
const nz=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'');
function isObj(q){return q.type==='mcq'||q.type==='fill'}
function mark(q,a){if(a==null||a==='')return null;return q.type==='mcq'?a===q.answer:q.answer.some(x=>nz(x)===nz(a))}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startRun(setId,mode,qsOv,o){o=o||{};const set=S.sets.find(s=>s.id===setId)||{id:'x',title:'Mistake practice',qs:qsOv,mins:0,attempts:[]};
 let qs=qsOv||set.qs;if(o.rand)qs=shuf(qs);let mins=o.mins!=null?o.mins:0;
 if(mode!=='study'&&!mins)mins=mode==='mock'?Math.ceil(qs.length*1.5):S.prefs.mins;
 run={set,qs,i:0,ans:{},checked:{},shown:{},mode,start:Date.now(),end:mins?Date.now()+mins*60000:null,mins,pw:0,tw:0};
 if(timer)clearInterval(timer);timer=setInterval(tick,500);go('run')}
function tick(){if(!run)return;const left=run.end?(run.end-Date.now())/1000:null,t=$('#tm'),e=$('#el');
 if(e)e.textContent='Elapsed '+fmt((Date.now()-run.start)/1000);
 if(left!==null){const lim=Math.max(60,run.mins*6);if(t){t.textContent=fmt(left);t.classList.toggle('warn',left<=lim)}
  if(left<=lim&&left>0&&!run.warned){run.warned=1;toast('Time is running out — '+fmt(left)+' left.')}
  if(left<=0)finish(true)}}
function ansHas(i){const a=run.ans[i];return a!=null&&String(a).trim()!==''}
function runView(){if(!run)return home();const q=run.qs[run.i],i=run.i,n=run.qs.length,st=run.mode==='study',ck=run.checked[i];
 run.tw=Math.round(Object.keys(run.ans).filter(ansHas).length/n*100);let h='<div class="sticky"><div class="row" style="justify-content:space-between"><b>'+(st?'Study':run.mode==='cbt'?'CBT':'Mock exam')+' · Q'+(i+1)+'/'+n+'</b>'+'<span class="row" style="gap:8px">'+(run.end?'<span class="tmb'+((run.end-Date.now())/1000<=Math.max(60,run.mins*6)?' warn':'')+'" id="tm" aria-label="Time remaining">'+fmt((run.end-Date.now())/1000)+'</span>':'')+'<span class="mu" id="el">Elapsed '+fmt((Date.now()-run.start)/1000)+'</span></span>'+'<button onclick="if(confirm(\'Quit? Your answers will be lost.\')){run=null;go(\'practice\')}">Quit</button></div><div class="bar"><i id="pb" style="width:'+(run.pw||0)+'%"></i></div></div>';
 h+='<div class="card'+(qA?' qin':'')+'"><span class="chip">'+TN[q.type]+' · '+q.marks+' mark'+(q.marks>1?'s':'')+(q.difficulty?' · '+q.difficulty:'')+'</span><p><b>'+esc(q.q)+'</b></p>';
 if(q.type==='mcq')h+=q.options.map((o,k)=>{let c='opt';if(run.ans[i]===k)c+=' sel';if(st&&ck){if(k===q.answer)c+=' ok';else if(run.ans[i]===k)c+=' no'}return '<button class="'+c+'" '+(ck?'disabled':'')+' onclick="pick('+k+')">'+'ABCDEFGH'[k]+'. '+esc(o)+'</button>'}).join('');
 else if(q.type==='fill')h+='<input placeholder="Type your answer" value="'+esc(run.ans[i]||'')+'" '+(ck?'disabled':'')+' oninput="run.ans['+i+']=this.value">';
 else h+='<textarea style="min-height:'+(q.type==='essay'?260:120)+'px" placeholder="Write your answer" oninput="run.ans['+i+']=this.value">'+esc(run.ans[i]||'')+'</textarea>';
 if(st){if(q.type==='fill'&&!ck)h+='<button class="p" style="margin-top:8px" onclick="run.checked['+i+']=1;render()">Check answer</button>';
  if(!isObj(q)&&!run.shown[i])h+='<button class="p" style="margin-top:8px" onclick="run.shown['+i+']=1;render()">Show model answer</button>';
  if(ck||run.shown[i])h+=fb(q,run.ans[i],ck,true)}
 h+='</div><div class="row"><button onclick="nav(-1)" '+(i?'':'disabled')+'>Previous</button>'+(i<n-1?'<button class="p" onclick="nav(1)">Next</button>':'<button class="p" onclick="finish()">Finish &amp; submit</button>')+'</div>';
 if(!st){h+='<h2>Questions</h2><div class="row pal">'+run.qs.map((x,k)=>'<button class="'+(ansHas(k)?'a':'')+'" onclick="qA=true;run.i='+k+';render()">'+(k+1)+'</button>').join('')+'</div><p><button class="p" onclick="finish()">Submit exam ('+(n-Object.keys(run.ans).filter(ansHas).length)+' unanswered)</button></p>'}
 return h}

 +'<path class="mcape" d="M22 24 Q6 30 8 52 Q20 46 26 30 Z" fill="#f59f00"/>'

function fb(q,a,ck,masc){const mk=(masc&&isObj(q)&&a!=null)?mascotHtml(mark(q,a)):'';const ok0=isObj(q)?mark(q,a):null;let h=mk+'<div class="fb'+(ok0===true?' okf':ok0===false?' nof':'')+'">';if(isObj(q)){const ok=ok0;h+=ok===null?'<b>Not answered.</b>':ok?'<b class="ok">Correct ✓</b>':'<b class="bad">Incorrect ✗</b>';h+='<div>Correct answer: <b>'+esc(q.type==='mcq'?'ABCDEFGH'[q.answer]+'. '+q.options[q.answer]:q.answer.join(' / '))+'</b></div>'}
 else h+='<div><b>Model answer:</b> '+esc(q.answer)+'</div>'+(q.rubric?'<div class="mu"><b>Marking guide:</b> '+esc(q.rubric)+'</div>':'');
 return h+(q.explanation?'<p>'+esc(q.explanation)+'</p>':'')+(q.takeaway?'<p><b>Key takeaway:</b> '+esc(q.takeaway)+'</p>':'')+'<div class="mu">Source: '+esc(q.source||'—')+' · Topic: '+esc(q.topic)+'</div></div>'}
function pick(k){const i=run.i;if(run.checked[i])return;run.ans[i]=k;if(run.mode==='study')run.checked[i]=1;render()}
function nav(d){qA=true;run.i=Math.min(run.qs.length-1,Math.max(0,run.i+d));render()}
function recalc(s){s.marks=0;s.max=0;s.pending=0;s.items.forEach(it=>{s.max+=it.q.marks;if(isObj(it.q))s.marks+=it.ok?it.q.marks:0;else if(it.got!=null)s.marks+=it.got;else if(it.your)s.pending++});s.pct=s.max?Math.round(s.marks/s.max*100):0}
function finish(auto){if(!run)return;if(timer){clearInterval(timer);timer=null}
 const items=run.qs.map((q,i)=>({q,your:ansHas(i)?run.ans[i]:null,ok:isObj(q)?mark(q,ansHas(i)?run.ans[i]:null):null,got:null}));
 const s={id:uid(),setId:run.set.id,title:run.set.title,subject:run.set.subject||'General',date:Date.now(),mode:run.mode,secs:Math.round((Date.now()-run.start)/1000),auto:!!auto,total:items.length,items};
 s.answered=items.filter(x=>x.your!=null).length;s.objN=items.filter(x=>isObj(x.q)&&x.your!=null).length;s.correct=items.filter(x=>x.ok===true).length;s.incorrect=items.filter(x=>x.ok===false).length;s.unanswered=s.total-s.answered;recalc(s);
 items.forEach(it=>{if(it.ok===false&&!S.mistakes.some(m=>m.qd.q===it.q.q&&!m.reviewed))S.mistakes.unshift({id:uid(),setId:s.setId,qd:it.q,your:it.your,date:s.date,topic:it.q.topic,reviewed:false})});
 const set=S.sets.find(x=>x.id===run.set.id);if(set)set.attempts.push({date:s.date,pct:s.pct,mode:s.mode});
 S.sessions.unshift(s);save();run=null;fin=true;if(auto)toast('Time is up — your exam was submitted automatically.');go('results',s.id)}

 '<label>Mode</label><select id="gm"><option value="study" '+(p.mode==='study'?'selected':'')+'>Study (instant feedback)</option><option value="cbt" '+(p.mode==='cbt'?'selected':'')+'>CBT (timed, no answers)</option><option value="mock" '+(p.mode==='mock'?'selected':'')+'>Mock exam</option></select>'+
 '<label>Timer</label><select id="gtm" onchange="$(\'#gtc\').style.display=this.value===\'c\'?\'block\':\'none\'">'+tOpts(p.mode==='study'?'0':TL.includes(p.mins)?String(p.mins):'20')+'</select><input id="gtc" type="number" min="1" max="300" placeholder="Minutes" style="display:none;margin-top:6px"><label>Difficulty</label><select id="gd"><option>easy</option><option selected>medium</option><option>hard</option><option value="mixed">Mixed (easy–hard)</option></select><details><summary>More options</summary><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="grand" style="width:auto"> Randomize question order when studying</label></details>'+
 '<p><button class="p" onclick="generate()">Generate</button> <button onclick="go(\'materials\')">Cancel</button></p><p class="mu">Questions are written from your material only. Larger sets take a few minutes.</p></div>'}
function practice(){return '<h1>Practice</h1>'+(S.sets.map(s=>{const best=s.attempts.length?Math.max(...s.attempts.map(a=>a.pct))+'%':'—';const nm=setMatIds(s).length;return '<div class="card"><b>'+esc(s.title)+'</b><div class="mu">'+s.qs.length+' questions · '+ago(s.date)+' · '+s.attempts.length+' attempts · best '+best+(nm>1?' · '+nm+' materials':'')+'</div><div class="row" style="margin-top:8px"><button class="p" onclick="go(\'start\',\''+s.id+'\')">Start session</button><button class="d" onclick="delS(\''+s.id+'\')">Delete</button></div></div>'}).join('')||'<div class="card mu">No question sets yet. Upload material and generate one.</div>')}
function startView(){const s=S.sets.find(x=>x.id===arg);if(!s)return practice();
 if(sp.id!==arg){const m=s.mins||0;sp={id:arg,mode:s.mode||'study',tsel:TL.includes(m)?String(m):'c',cval:m,rand:!!s.rand}}
 const md=(k,l)=>'<button class="'+(sp.mode===k?'p':'')+'" aria-pressed="'+(sp.mode===k)+'" onclick="sp.mode=\''+k+'\';render()">'+l+'</button>';
 return '<div class="step">Material › Set up › <b>Start</b> › Results</div><h1>Start session</h1><div class="mu">'+esc(s.title)+' · '+s.qs.length+' questions</div><div class="card"><label>Mode</label><div class="row seg">'+md('study','Study')+md('cbt','CBT')+md('mock','Mock exam')+'</div><p class="mu">'+({study:'Instant feedback after every question.',cbt:'Timed test. Answers are revealed after you submit.',mock:'Full exam experience. Answers are revealed after you submit.'}[sp.mode])+'</p><label>Timer</label><select onchange="sp.tsel=this.value;render()">'+tOpts(sp.tsel)+'</select>'+(sp.tsel==='c'?'<input type="number" min="1" max="300" placeholder="Minutes" value="'+(sp.cval||'')+'" oninput="sp.cval=+this.value" style="margin-top:6px">':'')+(sp.mode!=='study'&&sp.tsel==='0'?'<p class="mu">CBT and Mock always run on a timer, so a default is applied.</p>':'')+'<details><summary>More options</summary><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" '+(sp.rand?'checked':'')+' onchange="sp.rand=this.checked"> Randomize question order</label></details><p><button class="p" onclick="beginSp()">Begin</button> <button onclick="go(\'practice\')">Cancel</button></p></div>'}
function beginSp(){const m=sp.tsel==='c'?Math.min(300,Math.max(1,sp.cval||10)):+sp.tsel;startRun(sp.id,sp.mode,null,{mins:m,rand:sp.rand})}
function delS(id){if(!confirm('Delete this question set?'))return;S.sets=S.sets.filter(s=>s.id!==id);save();render()}
function results(){const s=S.sessions.find(x=>x.id===arg);if(!s)return progress();
 const fromFin=fin;fin=false;let h=(fromFin?'<div class="done"><span>✓</span> Session complete</div>':'')+'<h1>Results</h1><div class="card"><div class="big"><span id="sc" data-v="'+s.pct+'">'+s.pct+'</span>%</div><div class="bar" style="margin:6px 0"><i style="width:'+s.pct+'%"></i></div><div>'+s.marks+' / '+s.max+' marks · '+esc(s.title)+'</div><div class="mu">Correct '+s.correct+' · Incorrect '+s.incorrect+' · Unanswered '+s.unanswered+' · Time '+fmt(s.secs)+(s.auto?' · auto-submitted':'')+'</div>'+
 (s.pending?'<p class="mu">'+s.pending+' written answer(s) still need self-marking below — they count as 0 until you mark them. Written answers are marked by you against the model answer, not by AI.</p>':'')+
 '<p>'+(s.pct>=70?'Strong performance.':s.pct>=50?'Decent — review the questions you missed.':'Keep going — study the explanations below and retake.')+'</p></div>';
 s.items.forEach((it,i)=>{const q=it.q;h+='<div class="card"><span class="chip">Q'+(i+1)+' · '+TN[q.type]+(q.difficulty?' · '+q.difficulty:'')+'</span> '+(it.ok===true?'<b class="ok">Correct</b>':it.ok===false?'<b class="bad">Incorrect</b>':it.your==null?'<b class="mu">Unanswered</b>':'');
  h+='<p><b>'+esc(q.q)+'</b></p><div>Your answer: '+esc(it.your==null?'—':q.type==='mcq'?'ABCDEFGH'[it.your]+'. '+q.options[it.your]:it.your)+'</div>'+fb(q,it.your);
  if(!isObj(q))h+='<div class="row" style="margin-top:8px"><span class="mu">Self-mark ('+q.marks+' marks):</span><button onclick="selfMark(\''+s.id+'\','+i+',1)">Full</button><button onclick="selfMark(\''+s.id+'\','+i+',.5)">Half</button><button onclick="selfMark(\''+s.id+'\','+i+',0)">None</button>'+(it.got!=null?'<b>'+it.got+'</b>':'')+'</div>';h+='</div>'});
 return h+'<p><button class="p" onclick="go(\'practice\')">Back to practice</button></p>'}
function cards(){const ids=[...new Set(S.cards.map(c=>c.matId))];return '<h1>Flashcards</h1>'+(ids.map(id=>{const m=S.materials.find(x=>x.id===id),cs=S.cards.filter(c=>c.matId===id);return '<div class="card row" style="justify-content:space-between"><div><b>'+esc(m?m.title:'Deleted material')+'</b><div class="mu">'+cs.length+' cards · '+cs.filter(c=>c.status==='known').length+' known</div></div><button class="p" onclick="go(\'deck\',\''+id+'\')">Study</button></div>'}).join('')||'<div class="card mu">No flashcards yet. Open Materials and tap Flashcards on a file.</div>')}
let ci=0,cshow=false;
function flipC(){cshow=!cshow;const f=$('.flip');if(f)f.classList.toggle('on',cshow)}
function countUp(){const el=$('#sc');if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const v=+el.dataset.v,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);el.textContent=Math.round(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}
function deckView(){const cs=S.cards.filter(c=>c.matId===arg);if(!cs.length)return cards();ci=Math.min(ci,cs.length-1);const c=cs[ci];
 return '<h1>Flashcards</h1><div class="mu">Card '+(ci+1)+' / '+cs.length+' · '+c.status+'</div><div class="flip'+(cshow?' on':'')+'" onclick="flipC()"><div class="fi"><div class="ff card"><span class="chip">'+esc(c.topic)+'</span><p class="big" style="font-size:1.2rem">'+esc(c.front)+'</p><p class="mu">Tap to reveal</p></div><div class="ff bk card"><p>'+esc(c.back)+'</p><div class="mu">Source: '+esc(c.source||'—')+'</div></div></div></div>'+
 '<div class="row"><button onclick="ci=Math.max(0,ci-1);cshow=false;render()">Previous</button><button onclick="setC(\''+c.id+'\',\'known\')">Known</button><button onclick="setC(\''+c.id+'\',\'review\')">Needs review</button><button class="p" onclick="ci=Math.min('+(cs.length-1)+',ci+1);cshow=false;render()">Next</button></div><p><button onclick="go(\'cards\')">All decks</button></p>'}
function setC(id,st){S.cards.find(c=>c.id===id).status=st;save();const n=S.cards.filter(c=>c.matId===arg).length;ci=Math.min(n-1,ci+1);cshow=false;render()}
function mistakes(){const ms=S.mistakes;return '<h1>Mistakes</h1>'+(openM()?'<p><button class="p" onclick="startRun(\'x\',\'study\',S.mistakes.filter(m=>!m.reviewed).slice(0,20).map(m=>m.qd))">Practice my mistakes</button></p>':'')+
 (ms.map(m=>'<div class="card"><span class="chip">'+esc(m.topic)+'</span> <span class="chip">'+ago(m.date)+'</span>'+(m.reviewed?' <span class="chip ok">reviewed</span>':'')+'<p><b>'+esc(m.qd.q)+'</b></p><div>Your answer: '+esc(m.qd.type==='mcq'?m.qd.options[m.your]:m.your)+'</div>'+fb(m.qd,m.your)+'<p><button onclick="toggleM(\''+m.id+'\')">'+(m.reviewed?'Mark as not reviewed':'Mark reviewed')+'</button></p></div>').join('')||'<div class="card mu">No mistakes saved yet. Wrong MCQ and fill-in answers appear here automatically.</div>')}
function toggleM(id){const m=S.mistakes.find(x=>x.id===id);m.reviewed=!m.reviewed;save();render()}
function progress(){const A=agg(),ss=S.sessions,T={},Sb={};ss.forEach(s=>{s.items.forEach(it=>{if(isObj(it.q)&&it.your!=null){const t=T[it.q.topic]=T[it.q.topic]||[0,0];t[1]++;if(it.ok)t[0]++}});const b=Sb[s.subject]=Sb[s.subject]||[0,0];b[0]+=s.correct;b[1]+=s.objN});
 const days=[...Array(7)].map((_,k)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+k);const e=d.getTime()+864e5;return{l:d.toLocaleDateString(undefined,{weekday:'short'}),v:ss.filter(s=>s.date>=d.getTime()&&s.date<e).reduce((a,s)=>a+s.answered,0)}}),mx=Math.max(1,...days.map(d=>d.v));
 const rows=o=>Object.entries(o).filter(e=>e[1][1]).map(([k,v])=>'<div class="row" style="justify-content:space-between"><span>'+esc(k)+'</span><b>'+Math.round(v[0]/v[1]*100)+'% <span class="mu">('+v[1]+')</span></b></div>').join('')||'<span class="mu">No data yet.</span>';
 return '<h1>Progress</h1><div class="grid"><div class="card"><div class="big">'+A.q+'</div><div class="mu">Questions answered</div></div><div class="card"><div class="big">'+(A.acc==null?'—':A.acc+'%')+'</div><div class="mu">Objective accuracy</div></div><div class="card"><div class="big">'+ss.filter(s=>s.mode!=='study').length+'</div><div class="mu">Exams completed</div></div><div class="card"><div class="big">'+ss.length+'</div><div class="mu">Sessions</div></div></div>'+
 (A.cor?'<h2>Coins earned</h2><div class="card"><div class="coinStack">'+[...Array(Math.min(A.cor,12))].map((_,i)=>'<div class="coin" style="animation-delay:'+(i*70)+'ms;left:'+(i%6)*15+'px;bottom:'+Math.floor(i/6)*18+'px"></div>').join('')+'</div><div class="row" style="justify-content:space-between;margin-top:6px"><b>'+A.cor+' correct answer'+(A.cor===1?'':'s')+'</b>'+(A.cor>12?'<span class="mu">showing 12</span>':'')+'</div></div>':'')+
 (()=>{let streak=0;for(let i=days.length-1;i>=0;i--){if(days[i].v>0)streak++;else break}return '<h2>Streak</h2><div class="card"><div class="bolts">'+days.map((d,i)=>'<span class="bolt'+(d.v>0?' lit':'')+'" style="animation-delay:'+(i*90)+'ms" title="'+esc(d.l)+': '+d.v+'">⚡</span>').join('')+'</div><div class="mu" style="margin-top:4px">'+(streak?streak+'-day streak — keep it going!':'Study today to start a streak.')+'</div></div>'})()+
 '<h2>This week (questions answered)</h2><div class="card"><div class="days">'+days.map(d=>'<div style="height:'+Math.round(d.v/mx*100)+'%" title="'+d.v+'"></div>').join('')+'</div><div class="days" style="height:auto">'+days.map(d=>'<span class="mu" style="flex:1;text-align:center;font-size:.7rem">'+d.l+'</span>').join('')+'</div></div>'+
 '<h2>By subject</h2><div class="card">'+rows(Sb)+'</div><h2>By topic</h2><div class="card">'+rows(T)+'</div><h2>Recent results</h2>'+(ss.slice(0,8).map(s=>'<div class="card row" style="justify-content:space-between" onclick="go(\'results\',\''+s.id+'\')"><span>'+esc(s.title)+'<div class="mu">'+ago(s.date)+' · '+s.mode.toUpperCase()+'</div></span><b>'+s.pct+'%</b></div>').join('')||'<div class="card mu">Complete a session to see results here.</div>')}
function settings(){const p=S.prefs;return '<h1>Settings</h1><div class="card"><b>Appearance</b><div class="row seg" role="group" aria-label="Appearance" style="margin-top:8px">'+[['light','Light'],['dark','Dark'],['auto','System']].map(t=>'<button class="'+(p.theme===t[0]?'p':'')+'" aria-pressed="'+(p.theme===t[0])+'" onclick="setTheme(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div></div><div class="card"><b>Color</b><div class="swatches">'+Object.keys(COLORS).map(k=>'<button class="swatch'+(p.color===k?' sel':'')+'" style="background:'+COLORS[k].l[0]+'" aria-pressed="'+(p.color===k)+'" aria-label="'+k+'" onclick="setColor(\''+k+'\')"></button>').join('')+'</div><div class="mu" style="margin-top:6px;text-transform:capitalize">'+p.color+'</div></div><div class="card"><b>Study defaults</b><label>Default question count</label><select onchange="S.prefs.n=+this.value;save()">'+[5,10,20,30,40,50].map(n=>'<option '+(n===p.n?'selected':'')+'>'+n+'</option>').join('')+'</select><label>Default mode</label><select onchange="S.prefs.mode=this.value;save()"><option value="study" '+(p.mode==='study'?'selected':'')+'>Study</option><option value="cbt" '+(p.mode==='cbt'?'selected':'')+'>CBT</option><option value="mock" '+(p.mode==='mock'?'selected':'')+'>Mock</option></select><label>Default timer (minutes)</label><input type="number" min="1" value="'+p.mins+'" onchange="S.prefs.mins=Math.max(1,+this.value||20);save()"></div>'+
 '<div class="card"><b>Your data</b><p class="mu">StudyFlow keeps your materials, questions and results in this browser on this device. Clearing site data erases them.</p><button class="d" onclick="if(confirm(\'Erase ALL StudyFlow data on this device?\')){localStorage.removeItem(\'studyflow\');location.reload()}">Erase all data</button></div>'}
applyTheme();applyColor();render();
</script></body></html>
